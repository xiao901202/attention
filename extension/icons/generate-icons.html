<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: white; }
    .icons { display: flex; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
    .icon-box { text-align: center; }
    canvas { background: transparent; border: 1px solid #333; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; margin: 10px; }
    a { display: block; margin-top: 10px; color: #3fb950; }
  </style>
</head>
<body>
  <h1>🎨 擴展圖標生成器</h1>
  <p>點擊下方按鈕下載所有圖標 PNG 文件，然後將它們放到 icons 資料夾中。</p>
  
  <div class="icons">
    <div class="icon-box">
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>16x16</p>
      <a id="link16" download="icon16.png">下載</a>
    </div>
    <div class="icon-box">
      <canvas id="icon32" width="32" height="32"></canvas>
      <p>32x32</p>
      <a id="link32" download="icon32.png">下載</a>
    </div>
    <div class="icon-box">
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>48x48</p>
      <a id="link48" download="icon48.png">下載</a>
    </div>
    <div class="icon-box">
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>128x128</p>
      <a id="link128" download="icon128.png">下載</a>
    </div>
  </div>
  
  <button onclick="downloadAll()">📥 下載全部圖標</button>

  <script>
    function drawIcon(ctx, size) {
      const radius = size * 0.1875; // Corner radius
      const lineWidth = size * 0.06;
      const padding = size * 0.25;
      
      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#3fb950');
      gradient.addColorStop(1, '#238636');
      
      // Rounded rectangle
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // Lines (representing text/scrolling)
      ctx.strokeStyle = 'white';
      ctx.lineCap = 'round';
      ctx.lineWidth = lineWidth;
      
      const y1 = size * 0.3125;
      const y2 = size * 0.5;
      const y3 = size * 0.6875;
      const x1 = padding;
      const x2 = size - padding;
      const x2short = size * 0.625;
      
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y1);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(x1, y2);
      ctx.lineTo(x2short, y2);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(x1, y3);
      ctx.lineTo(x2, y3);
      ctx.stroke();
      
      // Small circle indicator for larger sizes
      if (size >= 48) {
        ctx.beginPath();
        ctx.arc(size * 0.78, y2, size * 0.0625, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fill();
      }
    }
    
    const sizes = [16, 32, 48, 128];
    
    sizes.forEach(size => {
      const canvas = document.getElementById(`icon${size}`);
      const ctx = canvas.getContext('2d');
      drawIcon(ctx, size);
      
      // Set download link
      const link = document.getElementById(`link${size}`);
      link.href = canvas.toDataURL('image/png');
    });
    
    function downloadAll() {
      sizes.forEach(size => {
        const link = document.getElementById(`link${size}`);
        link.click();
      });
    }
  </script>
</body>
</html>
