<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLM 模型測試台 | Model Comparison</title>
  <link rel="stylesheet" href="vlm-test.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>🧪 VLM 模型測試台</h1>
      <p class="header-sub">上傳影片 → 擷取畫面 → 比較不同模型的推論結果</p>
    </header>

    <!-- Config Panel -->
    <section class="config-panel">
      <div class="config-row">
        <div class="config-group">
          <label>API 伺服器</label>
          <input type="text" id="apiServer" value="http://140.112.41.111:8899" placeholder="http://host:port">
        </div>
        <div class="config-group">
          <label>API Key</label>
          <input type="text" id="apiKey" value="" placeholder="API key">
        </div>
        <div class="config-group">
          <label>模型 (可逗號分隔比較)</label>
          <input type="text" id="modelInput" value="qwen3.5:9b" placeholder="e.g. qwen3.5:9b, moondream">
        </div>
        <div class="config-group">
          <label>擷取間隔 (秒)</label>
          <input type="number" id="frameInterval" value="10" min="1" max="60">
        </div>
        <div class="config-group config-toggle">
          <label for="multiFrameToggle">三幀拼接模式</label>
          <div class="toggle-wrap">
            <input type="checkbox" id="multiFrameToggle" checked>
            <span class="toggle-hint">每段取 20%/50%/80% 水平拼接</span>
          </div>
        </div>
      </div>
      <div class="config-row">
        <div class="config-group flex-grow">
          <label>Prompt</label>
          <textarea id="promptInput" rows="3">這張圖片由左到右是同一段閱讀期間的三個時間點截圖（20%、50%、80%），請綜合這三張畫面描述使用者在這段時間閱讀的內容，包括文字和圖片。</textarea>
        </div>
      </div>
    </section>

    <!-- Upload + Preview -->
    <section class="upload-section">
      <div class="upload-left">
        <div class="upload-zone" id="uploadZone">
          <div class="upload-icon">📁</div>
          <h3>拖放影片檔案到此處</h3>
          <p>或點擊選擇檔案 (.mp4, .webm, .mov)</p>
          <input type="file" id="videoFile" accept="video/*" hidden>
        </div>
        <div class="video-preview-wrap" id="videoPreviewWrap" style="display: none;">
          <video id="videoPreview" controls playsinline></video>
          <div class="video-info" id="videoInfo">-</div>
        </div>
      </div>
      <div class="upload-right">
        <button class="btn-analyze" id="btnAnalyze" disabled>
          <span>🚀</span> 開始分析
        </button>
        <button class="btn-clear" id="btnClear" disabled>
          <span>🗑️</span> 清除結果
        </button>
        <button class="btn-export" id="btnExport" disabled>
          <span>📥</span> 匯出 JSON
        </button>
        <div class="status-box" id="statusBox">
          <div class="status-text" id="statusText">等待上傳影片...</div>
          <div class="progress-bar" id="progressWrap" style="display: none;">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Results -->
    <section class="results-section" id="resultsSection" style="display: none;">
      <h2>📊 分析結果</h2>
      <div class="results-tabs" id="resultsTabs">
        <!-- Model tabs rendered here -->
      </div>
      <div class="results-grid" id="resultsGrid">
        <!-- Frame result cards rendered here -->
      </div>
    </section>
  </div>

  <!-- Lightbox Overlay -->
  <div class="lightbox-overlay" id="lightboxOverlay">
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="Enlarged frame">
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
    <button class="lightbox-close" id="lightboxClose">✕</button>
  </div>

  <script src="vlm-test.js"></script>
</body>
</html>
